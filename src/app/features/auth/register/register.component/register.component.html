<div class="container">
    <form [formGroup]="registrationForm" class="registration-form" (ngSubmit)="submitRegistration()">
        <div class="form-section">
            <label for="username">Username: </label>
            <input id="username" type="text" formControlName="username" />
        </div>

        <div class="form-section">
            <label for="password">Password: </label>
            <input id="password" type="password" formControlName="password" />
        </div>

        <div class="form-section">
            <label for="confirm-password">Confirm Password: </label>
            <input id="confirm-password" type="password" formControlName="confirmPassword" />
        </div>

        @if (registrationForm.hasError('passwordMismatch')
        && (registrationForm.touched || registrationForm.dirty)) {
        <p class="validation-message">Passwords do not match</p>
        }

        <button class="register-button" type="submit" [disabled]="!registrationForm.valid">Register</button>
    </form>
</div>
