<div class="container">
    <div class="heading">
        <p>Work Notes</p>
    </div>
    <div class="note-list-section">
            <ul class="note-list">
                @for(note of notes; track note.id) {
                    <li><app-note-card [note]="note"></app-note-card></li>
                }
            </ul>
    </div>
</div>
