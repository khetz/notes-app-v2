<div class="container">
    <div class="note-title">
        <h3>{{note().title}}</h3>
    </div>
    <div class="note-description">
        <p class="note-text">{{formatNoteContent(note().content)}}</p>
        <p class="note-date">{{formatDatetime(note().lastUpdatedAt)}}</p>
    </div>

    <button (click)="analyse()" [disabled]="analysing()">
        {{ analysing() ? 'Analysing...' : '✦ Summarise & Tag' }}
    </button>

    @if(summary()) {
    <div class="summary">
        <strong>Summary</strong>
        <p>{{ summary()}}</p>
    </div>
    }

    @if (tags().length > 0) {
    <div class="tags">
        @for (tag of tags(); track tag) {
        <span class="tag">{{ tag }}</span>
        }
    </div>
    }
</div>
